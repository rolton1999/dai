version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - containedctx
    - wsl_v5
  settings:
    wsl_v5:
      default: default
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
      enable:
        - after-block

formatters:
  enable:
    - gofmt
